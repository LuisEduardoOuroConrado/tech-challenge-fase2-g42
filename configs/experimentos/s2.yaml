# Caminhos relativos a este YAML. Compara três configurações × cinco seeds.
name: comparativo_s2
instances:
  - ../../data/instances/sp_15.json
  - ../../data/instances/sp_40.json
fleet: ../frota.yaml
fitness: ../fitness.yaml
out: ../../data/resultados/comparativo_s2
seeds: [7, 17, 42, 73, 101]
two_opt_max_passes: 100
ga_configs:
  puro: &base
    population_size: 100
    generations: 300
    crossover_rate: 0.9
    mutation_rate: 0.2
    elitism: 2
    tournament_size: 3
    crossover: ox
    mutation: inversion
  hibrido:
    <<: *base
    seed_nearest_neighbor: true
    local_search_rate: 0.3
  pmx:
    <<: *base
    crossover: pmx
    seed_nearest_neighbor: true
    local_search_rate: 0.3
