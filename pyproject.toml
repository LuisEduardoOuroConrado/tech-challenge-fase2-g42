[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medroute"
version = "0.1.0"
description = "Otimização de rotas para distribuição de medicamentos e insumos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.18,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "openai>=1.59,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "rich>=13.9,<15",
    "streamlit>=1.41,<2",
    "typer>=0.15,<1",
]

[project.scripts]
medroute = "medroute.app.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["medroute"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
